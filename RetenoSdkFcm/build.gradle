plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
    id 'de.mannodermaus.android-junit5'
    id 'org.jetbrains.kotlinx.kover'
}
apply from: file("$project.rootDir/config.gradle")
apply from: "$project.rootDir/test_dependencies.gradle"

kover {
    excludeInstrumentation {
        packages('junit.framework', 'org.junit', 'org.robolectric', 'io.mockk')
    }
}

koverReport {
    androidReports('debug') {
        filters {
            includes {
                packages('com.reteno.fcm')
            }
            excludes {
                classes('com.reteno.fcm.R', 'com.reteno.fcm.R$*', 'com.reteno.fcm.BuildConfig')
            }
        }
        verify {
            rule('FCM module is fully covered') {
                bound {
                    minValue = 100
                    metric = kotlinx.kover.gradle.plugin.dsl.MetricType.LINE
                }
                bound {
                    minValue = 100
                    metric = kotlinx.kover.gradle.plugin.dsl.MetricType.BRANCH
                }
            }
        }
    }
}

android {
    def globalConfig = rootProject.ext

    namespace 'com.reteno.fcm'
    compileSdk globalConfig.androidCompileSdkVersion

    defaultConfig {
        minSdk globalConfig.androidMinSdkVersion
        targetSdk globalConfig.androidTargetSdkVersion

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        qa {
            debuggable true
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-opt-in=com.reteno.core.InternalRetenoApi']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    api project(':RetenoSdkCore')
    api project(':RetenoSdkPush')

    implementation "androidx.core:core-ktx:1.9.0"

    // Provided dependencies and will not be shown in pom file
    compileOnly("com.google.firebase:firebase-messaging:23.1.1") {
        exclude module: 'support-v4'
    }
    // Provided dependencies and will not be shown in pom file
    compileOnly("com.google.firebase:firebase-messaging-ktx:23.1.1") {
        exclude module: 'support-v4'
    }

    testDependencies()
}
