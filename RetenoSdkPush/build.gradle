plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
    id 'de.mannodermaus.android-junit5'
    id 'org.jetbrains.kotlinx.kover'
}
apply from: file("$project.rootDir/config.gradle")
apply from: "$project.rootDir/test_dependencies.gradle"

kover {
    excludeInstrumentation {
        packages('junit.framework', 'org.junit', 'org.robolectric', 'io.mockk')
    }
}

koverReport {
    androidReports('debug') {
        filters {
            includes {
                packages('com.reteno.push')
            }
            excludes {
                classes('com.reteno.push.R', 'com.reteno.push.R$*', 'com.reteno.push.BuildConfig')
            }
        }
        verify {
            rule('Push module is fully covered') {
                bound {
                    minValue = 100
                    metric = kotlinx.kover.gradle.plugin.dsl.MetricType.LINE
                }
                bound {
                    minValue = 100
                    metric = kotlinx.kover.gradle.plugin.dsl.MetricType.BRANCH
                }
            }
        }
    }
}

android {
    def globalConfig = rootProject.ext

    namespace 'com.reteno.push'
    compileSdk globalConfig.androidCompileSdkVersion

    defaultConfig {
        minSdk globalConfig.androidMinSdkVersion
        targetSdk globalConfig.androidTargetSdkVersion

        consumerProguardFiles "consumer-rules.pro"
        resValue "string", "notification_icon", "com.reteno.notification_icon"
        resValue "string", "notification_icon_color", "com.reteno.notification_icon_color"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        qa {
            debuggable true
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-opt-in=com.reteno.core.InternalRetenoApi']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    api project(':RetenoSdkCore')

    implementation "androidx.core:core-ktx:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.6.4"

    testDependencies()
}