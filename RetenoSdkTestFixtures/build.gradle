plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

kotlin {
    jvmToolchain(8)
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
